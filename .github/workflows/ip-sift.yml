name: ip-sift
on:
  workflow_dispatch:
    inputs:
      count:
        description: "浏览器实测候选数(每1个约2分钟)"
        default: "10"
  schedule:
    - cron: "0 */6 * * *"   # 兜底自动滚池(GitHub schedule 不准, 6h 档实际 6~12h, 无所谓)
jobs:
  sift:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GIST_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      SIFT_COUNT: ${{ inputs.count || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install seleniumbase pyautogui
      - name: Stage 1 — 抓取免费列表 + 质量预筛 + 连通测
        run: python ip_sift.py
      - name: Upload sifted list
        uses: actions/upload-artifact@v4
        with:
          name: sifted-${{ github.run_id }}
          path: sifted.txt
          if-no-files-found: ignore
      - name: Stage 2 — 逐个真·试盾(UC模式), 出token进good_pool
        run: python sift_browser.py
