name: uc-turnstile-test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "solve_test=只测token | reg=完整注册"
        default: "solve_test"
jobs:
  uc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install seleniumbase pyautogui opencv-python-headless
      - name: UC mode turnstile solve (test)
        if: ${{ inputs.mode == 'solve_test' }}
        run: xvfb-run -a python uc_ts.py
      - name: Upload debug screenshot
        if: ${{ inputs.mode == 'solve_test' }}
        uses: actions/upload-artifact@v4
        with:
          name: uc-debug-${{ github.run_id }}
          path: uc_debug.png
          if-no-files-found: ignore
