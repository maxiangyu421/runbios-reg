name: runbios-reg
on:
  workflow_dispatch:
    inputs:
      count:
        description: "注册数量"
        default: "1"
      mode:
        description: "reg=完整注册 | solve_test=只测turnstile"
        default: "reg"
jobs:
  reg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIST_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browsers (patchright > playwright fallback)
        run: |
          pip install patchright playwright
          python -m patchright install --with-deps chrome || true
          python -m playwright install --with-deps chrome || true
      - name: Solve turnstile (test only)
        if: ${{ inputs.mode == 'solve_test' }}
        run: xvfb-run -a python reg_action.py --solve-only
      - name: Upload debug screenshots
        if: ${{ inputs.mode == 'solve_test' }}
        uses: actions/upload-artifact@v4
        with:
          name: ts-debug-${{ github.run_id }}
          path: ts_debug*.png
          if-no-files-found: ignore
      - name: Upload debug screenshot
        if: ${{ inputs.mode == 'solve_test' }}
        uses: actions/upload-artifact@v4
        with:
          name: ts-debug
          path: ts_debug.png
          if-no-files-found: ignore
      - name: Register
        if: ${{ inputs.mode != 'solve_test' }}
        run: xvfb-run -a python reg_action.py
