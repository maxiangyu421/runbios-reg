name: runbios-reg
on:
  workflow_dispatch:
    inputs:
      count:
        description: "注册数量"
        default: "1"
      mode:
        description: "reg=完整注册 | solve_test=只测turnstile"
        default: "reg"
jobs:
  reg:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      GIST_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip            # 依赖基本不变, 命中缓存可省 ~40s
      - name: Install deps (UC solver, reg 模式够用即可)
        if: ${{ inputs.mode != 'solve_test' }}
        run: pip install seleniumbase pyautogui
      - name: Install deps (solve_test 才需要 patchright/playwright 全家桶)
        if: ${{ inputs.mode == 'solve_test' }}
        run: |
          pip install seleniumbase pyautogui opencv-python-headless patchright playwright
          python -m patchright install --with-deps chrome || true
          python -m playwright install --with-deps chrome || true
      - name: Fetch last-good proxy (优质池置顶, 省试错)
        if: ${{ inputs.mode != 'solve_test' }}
        run: |
          python -c "
          import json, os, urllib.request
          req = urllib.request.Request('https://api.github.com/gists/' + os.environ['GIST_ID'],
                                       headers={'Authorization': 'token ' + os.environ['GIST_TOKEN']})
          g = json.load(urllib.request.urlopen(req, timeout=15))
          files = g.get('files') or {}
          pool = ((files.get('good_pool.txt') or {}).get('content') or '').strip()
          last = ((files.get('good_proxy.txt') or {}).get('content') or '').strip()
          reserve = ((files.get('reserve_pool.txt') or {}).get('content') or '').strip()
          open('good_pool.txt', 'w').write(pool)
          open('good_proxy.txt', 'w').write(last if last else ((pool.splitlines() or [''])[0] if pool else ''))
          base = [l.strip() for l in open('proxies.txt') if l.strip() and not l.startswith('#')]
          merged = list(dict.fromkeys([l for l in pool.splitlines() if l.strip()] + last.splitlines() + base + reserve.splitlines())) if (pool or last or reserve) else base
          open('proxies.txt', 'w').write('\n'.join(merged))
          print('good_pool:', pool.replace(chr(10), ' ') or '(empty)')
          "
      - name: Solve turnstile (test only)
        if: ${{ inputs.mode == 'solve_test' }}
        run: xvfb-run -a python reg_action.py --solve-only
      - name: Upload debug screenshots
        if: ${{ inputs.mode == 'solve_test' }}
        uses: actions/upload-artifact@v4
        with:
          name: ts-debug-${{ github.run_id }}
          path: ts_debug*.png
          if-no-files-found: ignore
      - name: Upload debug screenshot
        if: ${{ inputs.mode == 'solve_test' }}
        uses: actions/upload-artifact@v4
        with:
          name: ts-debug
          path: ts_debug.png
          if-no-files-found: ignore
      - name: Register
        if: ${{ inputs.mode != 'solve_test' }}
        run: xvfb-run -a python reg_action.py
